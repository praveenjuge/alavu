name: Alavu
options:
  bundleIdPrefix: com.praveenjuge
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    DEVELOPMENT_TEAM: LW385M78LW
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  AlavuKit:
    path: Packages/AlavuKit
  ConvexMobile:
    url: https://github.com/convex/convex-swift
    exactVersion: 0.8.2
  WorkOS:
    url: https://github.com/workos/workos-ios
    exactVersion: 0.8.0
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.93.1
targets:
  Alavu:
    type: application
    platform: iOS
    sources:
      - path: Alavu
    dependencies:
      - package: AlavuKit
      - package: ConvexMobile
      - package: WorkOS
      - package: PostHog
      - target: AlavuWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenjuge.alavu
        PRODUCT_NAME: Alavu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Alavu/Alavu.entitlements
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Alavu/Info.plist
      properties:
        CFBundleDisplayName: Alavu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.finance
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Take a photo of a receipt to attach it to an entry.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.praveenjuge.alavu.sync]
        CFBundleURLTypes:
          - CFBundleURLName: com.praveenjuge.alavu
            CFBundleURLSchemes: [alavu]
        ConvexURL: $(CONVEX_URL)
        WorkOSClientID: $(WORKOS_CLIENT_ID)
        PostHogAPIKey: $(POSTHOG_API_KEY)
        PostHogHost: $(POSTHOG_HOST)
    entitlements:
      path: Alavu/Alavu.entitlements
      properties:
        com.apple.security.application-groups: [group.com.praveenjuge.alavu]
  AlavuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AlavuWidgets
    dependencies:
      - package: AlavuKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.praveenjuge.alavu.widgets
        PRODUCT_NAME: AlavuWidgets
        CODE_SIGN_ENTITLEMENTS: AlavuWidgets/AlavuWidgets.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
    info:
      path: AlavuWidgets/Info.plist
      properties:
        CFBundleDisplayName: Alavu
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AlavuWidgets/AlavuWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.praveenjuge.alavu]
schemes:
  Alavu:
    build:
      targets:
        Alavu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AlavuKit/AlavuKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
