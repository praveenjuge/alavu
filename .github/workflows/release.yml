name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  backend:
    name: Deploy backend, site and web app
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: Deploy Convex (production)
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: bunx convex deploy
      - name: Deploy site and web app
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun install --frozen-lockfile
          bun run test
          bunx cf deploy

  testflight:
    name: Upload to TestFlight
    needs: backend
    runs-on: macos-26
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: apps/ios
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/ios
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
      - name: Build and upload
        working-directory: apps/ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
          CI_DEV_CERT_P12_B64: ${{ secrets.CI_DEV_CERT_P12_B64 }}
          CI_DEV_CERT_PASSWORD: ${{ secrets.CI_DEV_CERT_PASSWORD }}
          RELEASE_NOTES: "Alavu ${{ github.ref_name }}"
        run: bundle exec fastlane beta
